mcu: STM32U535
board: Custom STM32U535 board
probe: stlink
server_type: openocd
server_args:
  - -f
  - interface/stlink.cfg
  - -f
  - target/stm32u5x.cfg
  - -c
  - adapter speed 1000
project_root: .
reset:
  strategy: default
  halt: true
hil:
  halt: true
  read_cpuid: true
  read_dbgmcu_idcode: true
  flash: false
  expected_core: Cortex-M33
notes: "STM32U535 OpenOCD/ST-Link identity smoke config; DBGMCU ID may be unavailable while Cortex-M33 remains verifiable. / STM32U535 OpenOCD/ST-Link 身份烟测配置；DBGMCU ID 可能不可读，但仍可验证 Cortex-M33。"
