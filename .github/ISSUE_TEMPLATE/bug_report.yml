name: "Bug report / Bug 报告"
description: "Report a reproducible STM32 GDB MCP problem. / 报告一个可复现的 STM32 GDB MCP 问题。"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "Summary / 摘要"
      description: "What failed, and what did you expect to happen? / 什么失败了？你期望发生什么？"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment / 环境"
      description: "Include OS, Python version, probe, GDB server, MCU, board, and MCP client. / 请包含 OS、Python 版本、调试器、GDB Server、MCU、开发板和 MCP 客户端。"
      placeholder: |
        OS / 操作系统:
        Python:
        Probe / 调试器:
        GDB server:
        MCU/board / MCU 和开发板:
        MCP client / MCP 客户端:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Reproduction steps / 复现步骤"
      description: "List the smallest sequence of MCP tools or commands that reproduces the issue. / 列出能复现问题的最小 MCP 工具或命令序列。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Debug evidence / 调试证据"
      description: "Paste sanitized MCP responses, GDB output, fault registers, RTT/UART logs, or CI logs. / 粘贴已脱敏的 MCP 响应、GDB 输出、故障寄存器、RTT/UART 日志或 CI 日志。"
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: "Checks / 检查项"
      options:
        - label: "I removed secrets, proprietary firmware paths, and private source snippets from the report. / 我已从报告中移除密钥、专有固件路径和私有源码片段。"
          required: true
        - label: "I ran `python setup_env.py` or described why I could not run it. / 我已运行 `python setup_env.py`，或说明了无法运行的原因。"
          required: true
