name: Bug report
description: Report a reproducible STM32 GDB MCP problem.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, probe, GDB server, MCU, board, and MCP client.
      placeholder: |
        OS:
        Python:
        Probe:
        GDB server:
        MCU/board:
        MCP client:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest sequence of MCP tools or commands that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Debug evidence
      description: Paste sanitized MCP responses, GDB output, fault registers, RTT/UART logs, or CI logs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets, proprietary firmware paths, and private source snippets from the report.
          required: true
        - label: I ran `python setup_env.py` or described why I could not run it.
          required: true
