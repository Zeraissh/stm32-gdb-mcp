name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke source entry points before installation
        run: |
          python -S setup_env.py --help
          python -S scripts/install_mcp.py --help
          python -S scripts/deploy.py --help
          python -S scripts/check_dist_contents.py --help
          python -S scripts/install_mcp.py codex --print

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        if: runner.os == 'Windows'
        run: python -m pytest -q

      # Coverage on one leg only: Windows-specific paths (COM ports, CTRL_BREAK) make a
      # cross-platform threshold noisy; this leg is the canonical coverage signal.
      - name: Run tests with coverage
        if: runner.os != 'Windows'
        run: python -m pytest -q --cov=mcp_server --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=81

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        if: runner.os != 'Windows'
        run: python -m mypy

      - name: Compile check
        run: python -m compileall src tests

      - name: Build package
        run: python -m build

      - name: Audit distribution contents
        run: python scripts/check_dist_contents.py dist/*

      - name: Smoke clean wheel install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw "wheel not found" }
          python -m venv .wheel-venv
          .\.wheel-venv\Scripts\python.exe -m pip install --disable-pip-version-check $wheel
          .\.wheel-venv\Scripts\python.exe -c "from importlib.metadata import entry_points; expected = {'stm32-gdb-mcp', 'stm32-gdb-mcp-check-env', 'stm32-gdb-mcp-install', 'stm32-gdb-mcp-deploy'}; scripts = {entry.name: entry for entry in entry_points(group='console_scripts')}; assert expected <= set(scripts); [scripts[name].load() for name in expected]"
          .\.wheel-venv\Scripts\stm32-gdb-mcp-check-env.exe --help
          .\.wheel-venv\Scripts\stm32-gdb-mcp-install.exe --help
          .\.wheel-venv\Scripts\stm32-gdb-mcp-deploy.exe --help
          .\.wheel-venv\Scripts\stm32-gdb-mcp-install.exe codex --print | .\.wheel-venv\Scripts\python.exe -c "import sys; text = sys.stdin.read(); assert text.startswith('[mcp_servers.stm32-gdb-mcp]') and 'command = ' in text"

      - name: Smoke clean wheel install (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-venv/bin/python -c "from importlib.metadata import entry_points; expected = {'stm32-gdb-mcp', 'stm32-gdb-mcp-check-env', 'stm32-gdb-mcp-install', 'stm32-gdb-mcp-deploy'}; scripts = {entry.name: entry for entry in entry_points(group='console_scripts')}; assert expected <= set(scripts); [scripts[name].load() for name in expected]"
          .wheel-venv/bin/stm32-gdb-mcp-check-env --help
          .wheel-venv/bin/stm32-gdb-mcp-install --help
          .wheel-venv/bin/stm32-gdb-mcp-deploy --help
          .wheel-venv/bin/stm32-gdb-mcp-install codex --print | .wheel-venv/bin/python -c "import sys, tomllib; data = tomllib.loads(sys.stdin.read()); assert 'stm32-gdb-mcp' in data['mcp_servers']"

  # Prove the declared lower bounds are real: install exactly the floor of every runtime
  # dependency on the oldest supported Python and run the full suite against them.
  min-versions:
    name: minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install floor versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install mcp==1.1.2 pygdbmi==0.11.0.0 pyserial==3.5 PyYAML==6.0
          python -m pip install --no-deps -e .
          python -m pip install pytest

      - name: Run tests against floors
        run: python -m pytest -q
