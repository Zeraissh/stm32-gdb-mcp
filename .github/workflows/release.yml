name: Release

# Publish the package to PyPI when a version tag is pushed (e.g. v0.5.0).
# Uses PyPI Trusted Publishing (OIDC) -- no API token is stored in the repo.
# One-time setup on PyPI is required (see docs/release.md > Publishing to PyPI).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Smoke source entry points before installation
        run: |
          python -S setup_env.py --help
          python -S scripts/install_mcp.py --help
          python -S scripts/deploy.py --help
          python -S scripts/check_dist_contents.py --help
          python -S scripts/install_mcp.py codex --print

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Quality gate (never publish a red tree)
        run: |
          python -m ruff check .
          python -m pytest -q
          python -m compileall src tests

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Audit distribution contents
        run: python scripts/check_dist_contents.py dist/*

      - name: Generate SHA-256 checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Smoke clean wheel install
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-venv/bin/python -c "from importlib.metadata import entry_points; expected = {'stm32-gdb-mcp', 'stm32-gdb-mcp-check-env', 'stm32-gdb-mcp-install', 'stm32-gdb-mcp-deploy'}; scripts = {entry.name: entry for entry in entry_points(group='console_scripts')}; assert expected <= set(scripts); [scripts[name].load() for name in expected]"
          .wheel-venv/bin/stm32-gdb-mcp-check-env --help
          .wheel-venv/bin/stm32-gdb-mcp-install --help
          .wheel-venv/bin/stm32-gdb-mcp-deploy --help
          .wheel-venv/bin/stm32-gdb-mcp-install codex --print | .wheel-venv/bin/python -c "import sys, tomllib; data = tomllib.loads(sys.stdin.read()); assert 'stm32-gdb-mcp' in data['mcp_servers']"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish from actual version tags, never from a manual dry-run dispatch.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/stm32-gdb-mcp
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The artifact carries SHA256SUMS.txt for the GitHub-release job, but the
      # publish action treats every file in dist/ as a distribution and errors on it.
      - name: Drop non-distribution files before publishing
        run: rm -f dist/SHA256SUMS.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    name: Publish GitHub Release
    needs: [build, publish-to-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
