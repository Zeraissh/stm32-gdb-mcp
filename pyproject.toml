[project]
name = "stm32-gdb-mcp"
version = "0.10.1"
description = "MCP server for STM32 debugging with GDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.7.0,<2",
    "pygdbmi>=0.11.0.0",
    "pyserial>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Programmable USB hub control (per-port power / USB2 data lines / V+I sampling).
# Optional on purpose: everything else in this server works unchanged without it,
# and CI stays hardware-free. Adds one wheel -- pyserial is already a runtime dep.
hub = ["smartusbhub>=1.2.1,<2"]
dev = [
    "build>=1.2",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "types-PyYAML",
    "types-pyserial",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/**",
    ".codegraph/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    ".venv/**",
    ".vs/**",
    "__pycache__/**",
    "build/**",
    "dist/**",
    "venv/**",
]

[project.scripts]
stm32-gdb-mcp = "mcp_server.server:cli_main"
stm32-gdb-mcp-check-env = "mcp_server.env_check:main"
stm32-gdb-mcp-install = "mcp_server.install_mcp:main"
stm32-gdb-mcp-deploy = "mcp_server.deploy:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "hil: hardware-in-the-loop tests that require a connected STM32 target",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pygdbmi.*", "serial.*", "smartusbhub.*"]
ignore_missing_imports = true
