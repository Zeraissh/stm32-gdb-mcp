[project]
name = "stm32-gdb-mcp"
version = "0.5.1"
description = "MCP server for STM32 debugging with GDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.1.2",
    "pygdbmi>=0.11.0.0",
    "pyserial>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/**",
    ".codegraph/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    ".venv/**",
    ".vs/**",
    "__pycache__/**",
    "build/**",
    "dist/**",
    "venv/**",
]

[project.scripts]
stm32-gdb-mcp = "mcp_server.server:cli_main"
stm32-gdb-mcp-check-env = "mcp_server.env_check:main"
stm32-gdb-mcp-install = "mcp_server.install_mcp:main"
stm32-gdb-mcp-deploy = "mcp_server.deploy:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "hil: hardware-in-the-loop tests that require a connected STM32 target",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
